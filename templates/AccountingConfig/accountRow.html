<tr id="accountRow_{{account.id}}">
    <td id="account_id_{{account.id}}" style="display:none;">{{account.id}}</td>
    <td id="account_title_{{account.id}}" contentEditable="true">{{account.name}}</td>
    <td id="account_description_{{account.id}}" contentEditable="true">{{account.description}}</td>
    <td id="account_type_title_{{account.id}}">{{account.type_title}}</td>
    <td><select id="account_parent_account_id" name="account_parent_account_id">
            {% if account.parent_account_id != "-none-" %}
            <option value="{{account.parent_account_id}}">{{account.parent_account_name}}</option>
            {% endif %}
            <option value="-none-">-none-</option>
            {% for account_option in account.parent_account_options %}
            <option value="{{account_option.id}}">{{account_option.name}}</option>
            {% endfor %}
        </select>
    </td>
    <td><button id="account_Update_{{account.id}}" onclick="updateAccount('{{account.id}}')">Update</button></td>
</tr>
