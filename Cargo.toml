[package]
name = "finance_overview_training"
version = "0.0.4"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
askama = "0.15.0"

#forcing others to higher version
#time = "0.3.44"

async-mongodb-session = "3.0.0"
async-session = "3.0.0"
async-trait = "0.1.89" # see https://stackoverflow.com/questions/65921581/how-can-i-define-an-async-method-in-a-trait and https://crates.io/crates/async-trait

axum = { version = "0.8.8"}
axum-extra = { version = "0.12.3", features = ["typed-header", "cookie"] }
axum-server = {version = "0.8", features = ["tls-rustls"] }

futures = "0.3"

log = "0.4.29"
log4rs = "1.4.0"
mail-send = "0.4.7"
once_cell = { version = "1.19.0"}
rand = "0.8.5"
regex-automata = "0.4.6"
rust-ini = {version = "0.21.0"}
secrecy = {version = "0.8.0", features = ["serde", "alloc"] }
serde ="1"
tokio = { version = "1.36", features = ["full"] }


[dependencies.mongodb]
version = "=2.8.2"
default-features = false
features = ["async-std-runtime", "bson-uuid-0_8"]